# The production nginx rules (D95). Section 6 of docs/hosting_and_costs.md is
# the list this file implements; section 8 names the file.

# ---------------------------------------------------------------------------
# Port 80: the health check, and nothing else
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # The deploy script asks the app whether it is alive over plain HTTP, before
    # any certificate is involved (Django's SECURE_REDIRECT_EXEMPT covers
    # health/, D94). The four proxy_set_header lines are inherited from the
    # second server block below only if they are set there, so this one repeats
    # what it needs.
    location = /health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the shop
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # The Cloudflare Origin Certificate, with Cloudflare set to "Full (strict)".
    # The owner puts origin.pem and origin.key in /etc/badshahstore/certs on the
    # server; docker-compose.prod.yml mounts that folder read-only.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Do not tell the world which nginx version answers.
    server_tokens off;

    # Both upload limits in the code are 2 MB (MAX_IMAGE_BYTES in
    # apps/catalog/validators.py and MAX_FILE_BYTES in
    # apps/catalog/csv_import.py), so 4 MB is double the largest real upload and
    # leaves room for the multipart wrapper. A test compares the three numbers.
    client_max_body_size 4m;

    # Text only: pictures and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # The host and the visitor's address as Django must see them: Host for
    # ALLOWED_HOSTS, the two address headers for CLIENT_IP_HEADER (D89) and
    # X-Forwarded-Proto for SECURE_PROXY_SSL_HEADER (D94). They sit at server
    # level so every location below inherits them.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A dot-file (.env, .git/config, .htaccess) is never served: a request with a
    # dot segment anywhere in its path answers 404.
    location ~ /\. {
        return 404;
    }

    # The static files are copied into this image by docker/Dockerfile.prod, and
    # the manifest storage gives every name a content hash: one name never means
    # new bytes, so a year of caching is safe (D90).
    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The same rule for media: a photo's file name holds a random uuid (D90).
    # This folder is used only while R2_BUCKET_NAME is empty.
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The service worker, the manifest and the offline page must reach Django
    # every time and must never carry a cache header: a worker cached for a year
    # can never be replaced, and the manifest names the icons a phone keeps
    # (D91). No add_header and no proxy_cache in these three blocks.
    location = /sw.js {
        proxy_pass http://web:8000;
    }

    location = /manifest.webmanifest {
        proxy_pass http://web:8000;
    }

    location = /offline/ {
        proxy_pass http://web:8000;
    }

    # Everything else is Django. Two rules matter here and must never be
    # "improved":
    #   1. nginx must not hide, rewrite or add the Content-Security-Policy or the
    #      Permissions-Policy header. The policy carries a fresh nonce per
    #      request that the page's one inline script matches (D93), so a proxy
    #      that touched the header would break that script.
    #   2. no cache header is added here: an HTML page depends on who is asking
    #      and is never cached (D90).
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
