[project]
name = "badshahstore"
version = "0.1.0"
description = "Badshah Store - online provision shop (Indore)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.11,<2",
    "celery[redis]>=5.4,<6",
    # Pillow is required by Django's ImageField (ProductImage, Slice 14).
    "Pillow>=11.0,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "django-stubs>=5.2.0,<6",
    "pytest>=9.0,<10",
    "pytest-django>=4.13,<5",
    "factory-boy>=3.3,<4",
    "pre-commit>=4.0,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Migrations are generated code: leave them alone.
extend-exclude = ["apps/*/migrations"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
# RUF012: Django's Meta, admin and migration class attributes are conventionally
# plain lists. Annotating each with ClassVar adds noise and no safety.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "badshahstore"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses plain asserts. S105/S106: test passwords and fake secret
# keys are not real secrets.
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/tests/*.py" = ["S101", "S105", "S106"]
# F405: settings modules use `from .base import *` by design.
"badshahstore/settings/*.py" = ["F405"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "badshahstore.settings.dev"

# Migrations: generated code, skip type errors.
[[tool.mypy.overrides]]
module = ["apps.*.migrations.*"]
ignore_errors = true

# Tests: looser typing.
[[tool.mypy.overrides]]
module = ["tests.*", "apps.*.tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--ds=badshahstore.settings.test --strict-markers"
testpaths = ["tests", "apps"]
