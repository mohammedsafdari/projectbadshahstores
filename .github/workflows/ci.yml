name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: badshahstore.settings.test
      SECRET_KEY: ci-only-insecure-secret-key
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/badshahstore
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badshahstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      # The stylesheet every page links is built, never committed (D93), so CI
      # builds it with the same pinned CLI and checks the result is real.
      - name: Tailwind CSS build
        run: |
          curl -sSLo /tmp/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          echo "7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4  /tmp/tailwindcss" | sha256sum -c -
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -c tailwind.config.js -i static/src/tailwind.css -o static/css/app.css --minify
          test -s static/css/app.css
          grep -q '\.bg-brand-500' static/css/app.css
          grep -q 'x-cloak' static/css/app.css
      - name: Tests
        run: uv run pytest
