{% load i18n %}
<form method="get" action="{{ range_action }}" class="mt-3 flex flex-wrap items-end gap-2 text-sm">
  <label class="block">{% translate "From" %}
    <input type="date" name="from" value="{{ from_value }}" class="mt-1 rounded border border-gray-400 px-3 py-2">
  </label>
  <label class="block">{% translate "To" %}
    <input type="date" name="to" value="{{ to_value }}" class="mt-1 rounded border border-gray-400 px-3 py-2">
  </label>
  <button type="submit" class="rounded bg-gray-900 px-4 py-3 font-medium text-white">{% translate "Show" %}</button>
</form>

{% if period.error %}
  <p role="alert" class="mt-2 rounded border border-red-400 bg-red-50 p-3 text-sm">{{ period.error }}</p>
{% else %}
  <p class="mt-2 text-sm text-gray-600">
    {% blocktranslate with start=period.start|date:'d M Y' end=period.end|date:'d M Y' %}Indian dates, both included: {{ start }} to {{ end }}.{% endblocktranslate %}
  </p>
{% endif %}
