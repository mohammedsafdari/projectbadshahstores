{# Everything Razorpay-specific in the browser lives in this one file (D76). #}
<div data-razorpay
     data-key="{{ session.key_id }}"
     data-order-id="{{ session.gateway_order_id }}"
     data-amount="{{ session.amount }}"
     data-callback="{{ callback_url }}"></div>

<button type="button" id="razorpay-pay-button" data-pay-now class="mt-4 w-full rounded bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600">
  {{ text.pay_now_button }}
</button>

<a href="{{ callback_url }}" data-payment-return class="mt-3 inline-block text-sm font-medium text-brand-600 hover:text-brand-700">
  {{ text.payment_confirming_heading }}
</a>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  (function () {
    var box = document.querySelector("[data-razorpay]");
    if (!box) { return; }
    var options = {
      key: box.dataset.key,
      order_id: box.dataset.orderId,
      name: "Badshah Stores",
      description: "Order payment",
      handler: function () { window.location.href = box.dataset.callback; },
      modal: { ondismiss: function () { window.location.href = box.dataset.callback; } }
    };
    var button = document.getElementById("razorpay-pay-button");
    if (button) {
      button.addEventListener("click", function () {
        var checkout = new window.Razorpay(options);
        checkout.open();
      });
    }
  }());
</script>
